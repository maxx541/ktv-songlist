<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MakoSing：KTV 點歌整理，大家預計要唱的歌一目了然，避免點到重複的歌。">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>MakoSing</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="style.css?v=20261007h">
  <script type="module" src="app.js?v=20261007h"></script>
</head>
<body>
  <div id="inapp-banner" class="banner" hidden>
    LINE／Facebook 內建瀏覽器不能用 Google 登入。<a id="open-external" href="#">改用手機瀏覽器開啟</a>，或直接用暱稱登入。
  </div>

  <header class="topbar">
    <h1><img class="brand-logo" src="img/logo.png" alt="" width="34" height="34"><span>MakoSing</span></h1>
    <div id="userbox" class="userbox"></div>
  </header>

  <main>
    <p id="loading" class="muted center pad">載入中…</p>

    <!-- 尚未設定 Firebase -->
    <section id="unconfigured-view" class="login-wrap" hidden>
      <div class="panel login">
        <h2>網站還沒設定好</h2>
      </div>
    </section>

    <!-- 登入 -->
    <section id="login-view" class="login-wrap" hidden>
     <div class="login-stage">
      <figure class="tachie" id="tachie" aria-hidden="true"><img id="tachie-img" alt="" decoding="async"></figure>
      <div class="panel login">
        <h2>日K唱</h2>
        <form id="login-form" class="stack" autocomplete="on">
          <label class="field">
            <span>暱稱</span>
            <input name="nickname" maxlength="20" required autocomplete="nickname">
          </label>
          <p id="login-error" class="error" hidden></p>
          <button class="btn primary" type="submit">進入</button>
        </form>
        <div class="or"><span>或</span></div>
        <button id="google-login" class="btn google" type="button">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
          使用 Google 登入
        </button>
        <p class="muted small center">暱稱登入僅限這台裝置；Google 登入可跨裝置。</p>
      </div>
     </div>
    </section>

    <!-- 第一次登入：設定暱稱 -->
    <section id="setup-view" class="login-wrap" hidden>
      <div class="panel login">
        <h2>設定你的暱稱</h2>
        <form id="setup-form" class="stack">
          <label class="field"><span>暱稱</span><input name="nickname" maxlength="20" required></label>
          <p id="setup-error" class="error" hidden></p>
          <button class="btn primary" type="submit">開始點歌</button>
          <button id="setup-cancel" class="btn ghost" type="button">換別的方式登入</button>
        </form>
      </div>
    </section>

    <!-- 主畫面 -->
    <section id="main-view" hidden>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="all">大家的歌</button>
        <button class="tab" role="tab" data-tab="mine">我的歌 <span id="my-count" class="count"></span></button>
        <div class="event-pick">
          <span class="ev-ic" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          <select id="event-select" aria-label="目前參與的活動"></select>
          <button id="event-edit" class="icon-btn" type="button" title="編輯這個活動" aria-label="編輯這個活動" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>
        </div>
      </nav>

      <div id="tab-all" class="tabpanel">
        <div class="toolbar">
          <input id="filter" type="search" placeholder="搜尋歌名或人名" aria-label="搜尋歌名或人名">
          <label class="check"><input id="only-dup" type="checkbox"> 只看重複</label>
        </div>
        <p id="stats" class="muted small"></p>
        <div id="people"></div>
      </div>

      <div id="tab-mine" class="tabpanel" hidden>
        <div class="toolbar">
          <button id="add-btn" class="btn primary">＋ 加歌</button>
          <button id="dl-btn" class="btn ghost" hidden>下載指令</button>
          <span class="spacer"></span>
          <button id="clear-mine" class="btn ghost danger-text">清空我的歌</button>
        </div>
        <ol id="my-list" class="my-list"></ol>
      </div>
    </section>
  </main>

  <!-- 加歌／更換 -->
  <dialog id="add-dialog" class="sheet">
    <div class="sheet-head">
      <h2 id="add-title">加歌</h2>
      <button class="icon-btn" data-close aria-label="關閉"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <nav id="source-tabs" class="seg">
      <button data-source="youtube">YouTube 歌單</button>
      <button data-source="link">貼上連結</button>
    </nav>
    <div id="add-body" class="sheet-body"></div>
    <div id="add-foot" class="sheet-foot" hidden></div>
  </dialog>

  <!-- 編輯 -->
  <dialog id="edit-dialog" class="sheet small">
    <form id="edit-form" method="dialog">
      <div class="sheet-head">
        <h2>編輯歌曲</h2>
        <button class="icon-btn" type="button" data-close aria-label="關閉"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body stack">
        <div id="edit-preview" class="edit-preview"></div>
        <label class="field"><span>歌名</span><input name="title" maxlength="200" required></label>
        <label class="field"><span>連結</span><input name="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..."></label>
        <p id="edit-dup" class="warn small" hidden></p>
        <p id="edit-error" class="error" hidden></p>
        <button id="edit-replace" type="button" class="btn ghost">從歌單或連結挑一首來更換</button>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- 批次下載指令（yt-dlp） -->
  <dialog id="dl-dialog" class="sheet">
    <div class="sheet-head">
      <h2>批次下載</h2>
      <button class="icon-btn" type="button" data-close aria-label="關閉"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="dl-body" class="sheet-body"></div>
  </dialog>

  <!-- 新增／編輯活動 -->
  <dialog id="event-dialog" class="sheet small">
    <form id="event-form" method="dialog">
      <div class="sheet-head">
        <h2 id="event-title">新增活動</h2>
        <button class="icon-btn" type="button" data-close aria-label="關閉"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body stack">
        <label class="field"><span>活動名稱</span><input name="ename" maxlength="40" required autocomplete="off"></label>
        <label class="field"><span>日期</span><input name="edate" type="date"></label>
        <label class="field"><span>位置</span><input name="eplace" maxlength="60" autocomplete="off"></label>
        <p id="event-error" class="error" hidden></p>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button id="event-submit" type="submit" class="btn primary">建立並參與</button>
      </div>
    </form>
  </dialog>

  <!-- 修改暱稱 -->
  <dialog id="nick-dialog" class="sheet small">
    <form id="nick-form" method="dialog">
      <div class="sheet-head">
        <h2>修改暱稱</h2>
        <button class="icon-btn" type="button" data-close aria-label="關閉"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body stack">
        <label class="field"><span>暱稱（大家看到的名字）</span><input name="nickname" maxlength="20" required></label>
        <p id="nick-error" class="error" hidden></p>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="submit" class="btn primary">儲存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
